    <script>
        let audioCtx = null;
        let soundEnabled = true;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!soundEnabled) return;
            initAudio();
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'correct') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.1);
                osc.frequency.setValueAtTime(783.99, now + 0.2);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                osc.start(now);
                osc.stop(now + 0.35);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.setValueAtTime(120, now + 0.15);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'gold') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(1200, now + 0.15);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            }
        }

            let totalExtraTime = 0; // sum of seconds

                    totalScoreMultiplier *= blooksData[i].bonusScoreMultiplier;
                    totalExtraTime += blooksData[i].bonusTime;
                }
            }

                goldMultiplier: 1 + totalGoldBonusPct,
                scoreMultiplier: totalScoreMultiplier,
                extraTime: totalExtraTime

            { id: 'n11', category: 'nature', question: "איזו חיה מפורסמת בייצור דבש?", options: ["צרעה", "דבורה", "פרפר", "נמלה"], correct: 1 },
            { id: 'n12', category: 'nature', question: "איזה בעל חיים חי במדבר וידוע בדבשת או שתי דבשות לאגירת שומן?", options: ["גמל", "סוס", "חמור", "יאק"], correct: 0 },
            { id: 'n13', category: 'nature', question: "איזו ציפור מסוגלת לרחף במקום ואפילו לעוף אחורה?", options: ["דרור", "קוליברי (יונק הדבש)", "נשר", "שחף"], correct: 1 },
            { id: 'n14', category: 'nature', question: "איזה דוב חי בקוטב הצפוני ומאופיין בפרווה לבנה לחלוטין?", options: ["דוב גריזלי", "דוב פנדה", "דוב קוטב (Polar Bear)", "דוב שחור"], correct: 2 },
            { id: 'n15', category: 'nature', question: "מהי החיה היבשתית הגדולה ביותר בעולם?", options: ["קרנף לבן", "היפופוטם", "פיל אפריקאי", "ג'ירפה"], correct: 2 },
            { id: 'n16', category: 'nature', question: "איזה בעל חיים ימי נחשב לאינטליגנטי מאוד ומבצע פעלולים בקלות?", options: ["כריש", "דולפין", "מדוזה", "סרטן"], correct: 1 },
            { id: 'n17', category: 'nature', question: "איזה בעל חיים נחשב למהיר ביותר בים?", options: ["דגי מפרש (Sailfish)", "כריש פטיש", "לווייתן קטלן", "טונה אדומה"], correct: 0 },
            { id: 'n18', category: 'nature', question: "מהו שם הכלב הקטן ביותר בעולם בממוצע?", options: ["פודל", "צ'יוואווה", "פומרניין", "מלטז"], correct: 1 },
            { id: 'n19', category: 'nature', question: "איזה חיה אוסטרלית מטילה ביצים אף על היותה יונק?", options: ["קנגורו", "ברווזן (Platypus)", "קואלה", "וומבט"], correct: 1 },
            { id: 'n20', category: 'nature', question: "כמה קיבות יש בדרך כלל לפרה או מעלי גירה?", options: ["1", "2", "3", "4"], correct: 3 }
        ];

        let gameState = {
            playerName: "שחקן אלמוני",
            selectedBlook: 'fox',
            selectedCategory: 'all',
            gold: 150,
            score: 0,
            currentQuestionIndex: 0,
            streak: 0,
            timeLeft: 15,
            timerInterval: null,
            activeRoundQuestions: [],
            recentQuestionIds: [] // Strictly tracks last shown questions to guarantee zero repetition
        };

        // Fisher-Yates shuffle algorithm for maximum randomness
        function fisherYatesShuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function renderMainMenu() {
            document.getElementById('stats-bar').classList.add('hidden');
            const container = document.getElementById('screen-container');
            
            let categoriesHTML = Object.keys(categoriesData).map(key => {
                let cat = categoriesData[key];
                let isSelected = gameState.selectedCategory === key;
                return `
                    <button onclick="selectCategory('${key}'); playSound('click');" class="p-2.5 sm:p-3 rounded-xl border-2 ${isSelected ? 'border-amber-400 bg-indigo-800/90 shadow-md shadow-amber-500/10' : 'border-indigo-500/40 bg-slate-800 hover:bg-slate-700'} font-bold text-xs sm:text-sm flex items-center justify-center gap-2 transition">
                        <span>${cat.icon}</span> ${cat.name}
                    </button>
                `;
            }).join('');

            container.innerHTML = `
                <div class="text-center flex flex-col items-center w-full max-w-lg animate-float">
                    <div class="text-4xl sm:text-5xl mb-1">🦊🪙⭐</div>
                    <h1 class="text-2xl sm:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-400 via-pink-500 to-indigo-400 mb-1">בלוקט טריוויה עברית פרו</h1>
                    <p class="text-slate-300 text-xs sm:text-sm mb-3">160+ שאלות, דמויות עם בונוסים מצטברים (Cumulative Perks)!</p>
                    
                    <div class="w-full bg-slate-800/95 p-3.5 rounded-2xl border-2 border-indigo-500/40 mb-3 shadow-inner">
                        <label class="block text-right text-xs text-indigo-300 font-bold mb-1">שם השחקן שלך:</label>
                        <input type="text" id="player-name-input" value="${gameState.playerName}" 
                            class="w-full bg-slate-900 border-2 border-indigo-600 rounded-xl px-4 py-2 text-white text-center font-bold focus:outline-none focus:border-amber-400 transition text-sm"
                            placeholder="הכנס שם...">
                    </div>

                    <div class="w-full bg-slate-800/90 p-3 rounded-2xl border-2 border-indigo-500/30 mb-4">
                        <label class="block text-right text-xs text-indigo-300 font-bold mb-2">בחר נושא לסבב זה:</label>
                        <div class="grid grid-cols-2 gap-2 max-h-[150px] overflow-y-auto p-1">
                            ${categoriesHTML}
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3 w-full">
                        <button onclick="playSound('click'); startGame()" class="arcade-button bg-gradient-to-r from-emerald-500 to-green-600 hover:from-emerald-400 hover:to-green-500 text-white font-black py-3 px-4 rounded-2xl border-b-4 border-green-800 text-sm sm:text-base flex items-center justify-center gap-2">
                            <span>🚀</span> התחל משחק
                        </button>
                        <button onclick="playSound('click'); renderShopMenu()" class="arcade-button bg-gradient-to-r from-amber-500 to-yellow-600 hover:from-amber-400 hover:to-yellow-500 text-white font-black py-3 px-4 rounded-2xl border-b-4 border-amber-800 text-sm sm:text-base flex items-center justify-center gap-2">
                            <span>🏪</span> חנות בלוקים
                        </button>
                    </div>
                </div>
            `;
        }

        function selectCategory(catKey) {
            gameState.selectedCategory = catKey;
            renderMainMenu();
        }

        function renderShopMenu() {
            const container = document.getElementById('screen-container');
            
            let blooksHTML = blooksData.map(blook => {
                let isSelected = gameState.selectedBlook === blook.id;
                let btnAction = '';
                let btnText = '';
                let btnClass = '';

                // Calculate cumulative perks up to this blook for previewing in shop
                let cumulativePreview = getCumulativePerks(blook.id);
                let perkSummary = `זהב: x${cumulativePreview.goldMultiplier.toFixed(1)} | ניקוד: x${cumulativePreview.scoreMultiplier.toFixed(1)} | זמן: +${cumulativePreview.extraTime}ש'`;

                if (blook.unlocked) {
                    if (isSelected) {
                        btnText = 'נבחר ✓';
                        btnClass = 'bg-emerald-600 text-white cursor-default';
                    } else {
                        btnText = 'בחר דמות';
                        btnClass = 'bg-indigo-600 hover:bg-indigo-500 text-white cursor-pointer';
                        btnAction = `selectBlook('${blook.id}')`;
                    }
                } else {
                    if (gameState.gold >= blook.price) {
                        btnText = `קנה (${blook.price} 🪙)`;
                        btnClass = 'bg-amber-500 hover:bg-amber-400 text-slate-950 font-black cursor-pointer gold-pulse';
                        btnAction = `buyBlook('${blook.id}')`;
                    } else {
                        btnText = `חסר זהב (${blook.price})`;
                        btnClass = 'bg-slate-700 text-slate-400 cursor-not-allowed';
                    }
                }

                return `
                    <div class="bg-slate-800/95 border-2 ${isSelected ? 'border-amber-400 shadow-amber-500/20 shadow-lg' : 'border-indigo-500/30'} rounded-2xl p-3 flex flex-col items-center justify-between transition">
                        <div class="text-3xl sm:text-4xl mb-1 animate-float">${blook.emoji}</div>
                        <div class="font-bold text-xs mb-0.5 text-center text-slate-100">${blook.name}</div>
                        <div class="text-[9px] text-amber-300 text-center font-semibold mb-1 bg-slate-900/80 px-2 py-1 rounded-lg w-full">${blook.desc}</div>
                        <div class="text-[8px] text-emerald-300 text-center mb-2 font-mono">סך הכל: ${perkSummary}</div>
                        <button onclick="${btnAction}; playSound('click');" class="w-full py-1.5 rounded-xl text-[11px] font-bold transition ${btnClass}">
                            ${btnText}
                        </button>
                    </div>
                `;
            }).join('');

            container.innerHTML = `
                <div class="w-full flex flex-col items-center">
                    <div class="flex justify-between items-center w-full mb-3">
                        <h2 class="text-base sm:text-xl font-black text-amber-400 flex items-center gap-2"><span>🏪</span> חנות הבלוקים (עם ירושת בונוסים מצטברת)</h2>
                        <div class="bg-amber-500/20 px-3 py-1 rounded-xl border border-amber-500/40 font-bold text-amber-300 text-xs sm:text-sm">
                            זהב זמין: ${gameState.gold} 🪙
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-2 sm:grid-cols-5 gap-2.5 w-full mb-4 max-h-[340px] overflow-y-auto p-1">
                        ${blooksHTML}
                    </div>

                    <button onclick="playSound('click'); renderMainMenu()" class="arcade-button bg-slate-700 hover:bg-slate-600 text-white font-bold py-2 px-6 rounded-xl border-b-4 border-slate-900 text-xs sm:text-sm">
                        חזרה לתפריט הראשי ⬅
                    </button>
                </div>
            `;
        }

        function selectBlook(id) {
            gameState.selectedBlook = id;
            renderShopMenu();
        }

        function buyBlook(id) {
            let blook = blooksData.find(b => b.id === id);
            if (blook && gameState.gold >= blook.price) {
                gameState.gold -= blook.price;
                blook.unlocked = true;
                gameState.selectedBlook = id;
                playSound('gold');
                renderShopMenu();
            }
        }

        function startGame() {
            const nameInput = document.getElementById('player-name-input');
            if (nameInput && nameInput.value.trim() !== "") {
                gameState.playerName = nameInput.value.trim();
            }

            gameState.score = 0;
            gameState.currentQuestionIndex = 0;
            gameState.streak = 0;

            // Filter pool by category
            let pool = masterQuestionsPool;
            if (gameState.selectedCategory !== 'all') {
                pool = masterQuestionsPool.filter(q => q.category === gameState.selectedCategory);
            }

            // Exclude questions that appeared recently in session memory to strictly prevent repetition
            let availablePool = pool.filter(q => !gameState.recentQuestionIds.includes(q.id));
            if (availablePool.length < 10) {
                // Reset memory if pool exhausted
                gameState.recentQuestionIds = [];
                availablePool = pool;
            }

            // Thorough Fisher-Yates shuffle
            let shuffledPool = fisherYatesShuffle([...availablePool]);

            // Pick 10 questions per round
            gameState.activeRoundQuestions = shuffledPool.slice(0, 10);

            // Record question IDs in session memory
            gameState.activeRoundQuestions.forEach(q => {
                gameState.recentQuestionIds.push(q.id);
                if (gameState.recentQuestionIds.length > 80) {
                    gameState.recentQuestionIds.shift();
                }
            });

            document.getElementById('stats-bar').classList.remove('hidden');
            updateStatsDisplay();
            loadQuestion();
        }

        function updateStatsDisplay() {
            document.getElementById('player-name-display').innerText = gameState.playerName;
            document.getElementById('gold-display').innerText = gameState.gold;
            document.getElementById('score-display').innerText = gameState.score;
            
            let currentBlookObj = blooksData.find(b => b.id === gameState.selectedBlook);
            document.getElementById('current-blook-avatar').innerText = currentBlookObj ? currentBlookObj.emoji : '🦊';
            
            let perks = getCumulativePerks(gameState.selectedBlook);
            document.getElementById('blook-perk-display').innerText = `בונוס מצטבר: זהב x${perks.goldMultiplier.toFixed(1)} | ניקוד x${perks.scoreMultiplier.toFixed(1)} | +${perks.extraTime}ש'`;
        }

        function loadQuestion() {
            if (gameState.currentQuestionIndex >= gameState.activeRoundQuestions.length) {
                endGame();
                return;
            }

            clearInterval(gameState.timerInterval);
            
            let perks = getCumulativePerks(gameState.selectedBlook);
            gameState.timeLeft = 15 + perks.extraTime;

            const q = gameState.activeRoundQuestions[gameState.currentQuestionIndex];
            const container = document.getElementById('screen-container');

            let optionsHTML = q.options.map((opt, idx) => `
                <button onclick="checkAnswer(${idx})" class="arcade-button text-right p-3.5 sm:p-4 rounded-2xl font-bold text-white bg-slate-800 hover:bg-indigo-700 border-2 border-indigo-500/40 hover:border-indigo-400 transition flex items-center justify-between text-xs sm:text-sm">
                    <span>${opt}</span>
                    <span class="w-7 h-7 sm:w-8 sm:h-8 rounded-xl bg-indigo-950 flex items-center justify-center text-indigo-300 text-xs font-black">${['א', 'ב', 'ג', 'ד'][idx]}</span>
                </button>
            `).join('');

            container.innerHTML = `
                <div class="w-full flex flex-col items-center">
                    <div class="flex justify-between items-center w-full mb-3 text-xs font-bold text-indigo-300">
                        <span>שאלה ${gameState.currentQuestionIndex + 1} מתוך ${gameState.activeRoundQuestions.length}</span>
                        <div class="flex items-center gap-2 bg-slate-800 px-3 py-1.5 rounded-xl border border-indigo-500/30">
                            <span>⏳ זמן:</span>
                            <span id="timer-val" class="text-amber-400 text-sm font-black">${gameState.timeLeft}</span>
                        </div>
                    </div>

                    <div class="w-full bg-slate-800/95 border-2 border-indigo-500/50 p-4 sm:p-6 rounded-3xl mb-4 text-center shadow-lg">
                        <h3 class="text-base sm:text-xl font-black text-white leading-relaxed">${q.question}</h3>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 w-full">
                        ${optionsHTML}
                    </div>
                </div>
            `;

            gameState.timerInterval = setInterval(() => {
                gameState.timeLeft--;
                const timerEl = document.getElementById('timer-val');
                if (timerEl) timerEl.innerText = gameState.timeLeft;

                if (gameState.timeLeft <= 0) {
                    clearInterval(gameState.timerInterval);
                    handleTimeout();
                }
            }, 1000);
        }

        function handleTimeout() {
            playSound('wrong');
            gameState.streak = 0;
            showFeedback(false, "נגמר הזמן! ⏰");
        }

        function checkAnswer(selectedIdx) {
            clearInterval(gameState.timerInterval);
            const q = gameState.activeRoundQuestions[gameState.currentQuestionIndex];
            const isCorrect = selectedIdx === q.correct;

            let perks = getCumulativePerks(gameState.selectedBlook);

            if (isCorrect) {
                playSound('correct');
                gameState.streak++;

                let baseScore = 100 + (gameState.timeLeft * 5) + (gameState.streak * 10);
                let baseGold = 25 + (gameState.streak * 5);

                let earnedScore = Math.round(baseScore * perks.scoreMultiplier);
                let earnedGold = Math.round(baseGold * perks.goldMultiplier);

                gameState.score += earnedScore;
                gameState.gold += earnedGold;
                updateStatsDisplay();

                showFeedback(true, `כל הכבוד! תשובה נכונה! 🎉 (+${earnedGold} זהב, +${earnedScore} נקודות עם בונוסים מצטברים)`);
            } else {
                playSound('wrong');
                gameState.streak = 0;
                showFeedback(false, `אופס! התשובה הנכונה הייתה: ${q.options[q.correct]} ❌`);
            }
        }

        function showFeedback(isCorrect, message) {
            const container = document.getElementById('screen-container');
            container.innerHTML = `
                <div class="text-center flex flex-col items-center w-full max-w-md animate-float">
                    <div class="text-4xl sm:text-5xl mb-2">${isCorrect ? '🌟' : '💥'}</div>
                    <h2 class="text-2xl sm:text-3xl font-black ${isCorrect ? 'text-emerald-400' : 'text-rose-400'} mb-2">${isCorrect ? 'תשובה מעולה!' : 'טעות בשאלה!'}</h2>
                    <p class="text-slate-200 font-bold text-xs sm:text-sm mb-5 bg-slate-800 p-4 rounded-2xl border-2 ${isCorrect ? 'border-emerald-500/40' : 'border-rose-500/40'} w-full">${message}</p>
                    
                    <button onclick="playSound('click'); gameState.currentQuestionIndex++; loadQuestion();" class="arcade-button w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-black py-3 rounded-2xl border-b-4 border-indigo-900 text-sm sm:text-base">
                        המשך לשאלה הבאה ➡️
                    </button>
                </div>
            `;
        }

        function endGame() {
            document.getElementById('stats-bar').classList.add('hidden');
            const container = document.getElementById('screen-container');
            let currentBlookObj = blooksData.find(b => b.id === gameState.selectedBlook);

            container.innerHTML = `
                <div class="text-center flex flex-col items-center w-full max-w-md animate-float">
                    <div class="text-5xl sm:text-6xl mb-2">${currentBlookObj ? currentBlookObj.emoji : '🏆'}</div>
                    <h2 class="text-2xl sm:text-3xl font-black text-amber-400 mb-1">כל הכבוד, ${gameState.playerName}!</h2>
                    <p class="text-slate-300 text-xs sm:text-sm mb-4">סיימת את הסבב בהצלחה בעזרת הבונוסים המצטברים של הדמות שלך!</p>

                    <div class="grid grid-cols-2 gap-3 w-full mb-5">
                        <div class="bg-slate-800 border-2 border-amber-500/40 p-3.5 rounded-2xl text-center">
                            <div class="text-xs text-slate-400 mb-1">סך הכל זהב</div>
                            <div class="text-xl sm:text-2xl font-black text-amber-300">🪙 ${gameState.gold}</div>
                        </div>
                        <div class="bg-slate-800 border-2 border-emerald-500/40 p-3.5 rounded-2xl text-center">
                            <div class="text-xs text-slate-400 mb-1">ניקוד סופי</div>
                            <div class="text-xl sm:text-2xl font-black text-emerald-300">⭐ ${gameState.score}</div>
                        </div>
                    </div>

                    <div class="w-full flex flex-col gap-2.5">
                        <button onclick="playSound('click'); renderMainMenu()" class="arcade-button w-full bg-gradient-to-r from-emerald-500 to-green-600 hover:from-emerald-400 hover:to-green-500 text-white font-black py-3 rounded-2xl border-b-4 border-green-800 text-sm sm:text-base">
                            🔄 שחק סבב חדש (שאלות חדשות לחלוטין)
                        </button>
                        <button onclick="playSound('click'); renderShopMenu()" class="arcade-button w-full bg-gradient-to-r from-amber-500 to-yellow-600 hover:from-amber-400 hover:to-yellow-500 text-white font-black py-3 rounded-2xl border-b-4 border-amber-800 text-sm sm:text-base">
                            🏪 חנות בלוקים
                        </button>
                    </div>
                </div>
            `;
        }

        // Initialize application on load
        window.onload = function() {
            renderMainMenu();
        };
    </script>
</body>
</html>
